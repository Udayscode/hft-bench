services:
  # 1. REDPANDA STREAMING LAYER
  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v23.2.1
    container_name: hft-redpanda
    restart: unless-stopped
    command:
      - redpanda
      - start
      - --mode=dev-container
      - --smp=1
      - --memory=1G
      - --reserve-memory=0M
      - --overprovisioned
      - --check=false
      - --node-id=0
      - --kafka-addr=plaintext://0.0.0.0:9092
      - --advertise-kafka-addr=plaintext://127.0.0.1:9092
    ports:
      - "19092:19092"
      - "9092:9092"
    volumes:
      - redpanda-data:/var/lib/redpanda/data
    cpuset: "10,11"
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    network_mode: "host" 

  # 2. BOT FLEET (Rust Load Generator)
  bot-fleet:
    build:
      context: .
      dockerfile: services/bot-fleet/Dockerfile
    container_name: hft-bot-fleet
    restart: unless-stopped
    environment:
      KAFKA_BROKER: localhost:9092
      ORCHESTRATOR_URL: http://localhost:50051
      SHADOW_ENGINE_URL: http://localhost:50053
      RUST_LOG: info
    network_mode: "host"
    user: "root"
    cpuset: "4,5,6,7"
    volumes:
      - /tmp:/tmp
    depends_on:
      redpanda:
        condition: service_healthy

  # 3. TIMESCALEDB (Telemetry TSDB)
  timescaledb:
    image: timescale/timescaledb-ha:pg15
    container_name: hft-timescaledb
    restart: unless-stopped
    network_mode: "host"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: hft_telemetry
    volumes:
      - hft-db-data:/home/postgres/pgdata/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d hft_telemetry"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 4. TELEMETRY INGESTER
  telemetry-ingester:
    build:
      context: ./services/telemetry-ingester
      dockerfile: Dockerfile
    container_name: hft-telemetry-ingester
    restart: unless-stopped
    network_mode: "host"
    cpuset: "10,11"
    environment:
      KAFKA_BROKER: localhost:9092
      DATABASE_URL: postgres://postgres:password@localhost:5432/hft_telemetry?sslmode=disable
    depends_on:
      timescaledb:
        condition: service_healthy

  # 5. SUBMISSION API
  submission-api:
    build:
      context: ./services/submission-api
      dockerfile: Dockerfile
    container_name: hft-submission-api
    restart: unless-stopped
    network_mode: "host"
    ports:
      - "8080:8080"
    environment:
      BOT_FLEET_URL: localhost:50052
      ORCHESTRATOR_URL: localhost:50051
      DATABASE_URL: postgres://postgres:password@localhost:5432/hft_telemetry?sslmode=disable
    depends_on:
      bot-fleet:
        condition: service_started
      timescaledb:
        condition: service_healthy

  # 6. LEADERBOARD API
  leaderboard:
    build:
      context: ./services/leaderboard
      dockerfile: Dockerfile
    container_name: hft-leaderboard
    restart: unless-stopped
    network_mode: "host"
    ports:
      - "3001:3001"
    environment:
      DATABASE_URL: postgres://postgres:password@localhost:5432/hft_telemetry?sslmode=disable
      PORT: 3001
    depends_on:
      timescaledb:
        condition: service_healthy

  # 6b. LEADERBOARD UI (Next.js Frontend)
  leaderboard-ui:
    build:
      context: ./services/leaderboard-ui
      dockerfile: Dockerfile
    container_name: hft-leaderboard-ui
    restart: unless-stopped
    network_mode: "host"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:3001
      - PORT=3000
    depends_on:
      - leaderboard

  # 6. SHADOW ENGINE (Reference gRPC Matching Engine)
  shadow-engine:
    build:
      context: .
      dockerfile: services/shadow-engine/Dockerfile
    container_name: hft-shadow-engine
    restart: unless-stopped
    network_mode: "host"
    cpuset: "8,9"
    environment:
      PORT: 50053
      RUST_LOG: info


volumes:
  hft-db-data:
    driver: local
  redpanda-data:
    driver: local