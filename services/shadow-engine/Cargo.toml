[package]
name = "shadow-engine"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio = { version = "1.36", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time"] }
tonic = { version = "0.11", features = ["transport"] }
prost = "0.12"
async-trait = "0.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[build-dependencies]
tonic-build = "0.11"